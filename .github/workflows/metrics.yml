name: Content Factory — сбор метрик и отчёт

on:
  schedule:
    # Каждый день в 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    concurrency:
      group: content-factory-metrics
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Собрать метрики и отправить отчёт в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_REVIEW_CHANNEL: ${{ secrets.TELEGRAM_REVIEW_CHANNEL }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_ID: ${{ secrets.META_INSTAGRAM_ID }}
        run: node dist/metrics.js --report

      - name: Сохранить состояние в репозиторий
        if: always()
        run: |
          git config user.name "content-factory"
          git config user.email "actions@github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Нет изменений состояния"
          else
            git commit -m "chore: обновить метрики"
            git push
          fi