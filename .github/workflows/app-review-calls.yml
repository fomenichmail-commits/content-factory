name: Content Factory — тестовые вызовы для App Review

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Сколько Marketing API вызовов набрать"
        required: false
        default: "500"
      delay:
        description: "Пауза между вызовами в мс"
        required: false
        default: "1000"

permissions:
  contents: write

jobs:
  calls:
    runs-on: ubuntu-latest
    concurrency:
      group: app-review-calls
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Набрать тестовые вызовы по всем разрешениям
        continue-on-error: true
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_AD_ACCOUNT: ${{ secrets.META_AD_ACCOUNT }}
          MARKETING_CALLS_TARGET: ${{ github.event.inputs.target || '500' }}
          MARKETING_CALLS_DELAY_MS: ${{ github.event.inputs.delay || '1000' }}
        run: node dist/cli/app-review-calls.js